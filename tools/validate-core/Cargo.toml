[package]
name = "validate-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[dependencies]
# preserve_order: JSON objects iterate in declaration order, which the
# oracle relies on for property traversal and therefore error order.
serde_json = { version = "1.0", features = ["preserve_order"] }
regex = "1.10"

[dev-dependencies]
tempfile = "3.8"