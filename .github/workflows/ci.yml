name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path tools/Cargo.toml
      - run: cargo clippy --manifest-path tools/Cargo.toml --all-targets -- -D warnings
